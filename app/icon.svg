<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synaxis">
  <defs>
    <linearGradient id="syn-bg" x1="40" y1="16" x2="472" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D6AF6"/>
      <stop offset="0.55" stop-color="#5B45EA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="syn-glow" cx="256" cy="172" r="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="syn-sheen" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- アプリタイル -->
  <rect width="512" height="512" rx="116" fill="url(#syn-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#syn-sheen)"/>

  <!-- 焦点の光 -->
  <circle cx="256" cy="172" r="150" fill="url(#syn-glow)"/>

  <!-- 集う会衆（焦点へ向かう弧状の列） -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M138 250 Q256 300 374 250" stroke-width="30" opacity="0.95"/>
    <path d="M98 292 Q256 348 414 292" stroke-width="27" opacity="0.74"/>
    <path d="M60 332 Q256 396 452 332" stroke-width="24" opacity="0.54"/>
  </g>

  <!-- 中心（祭壇／キリスト） -->
  <circle cx="256" cy="170" r="34" fill="#FFFFFF"/>
</svg>
